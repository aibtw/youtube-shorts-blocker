<!DOCTYPE html>
<html>
  <head>
    <title>YouTube Shorts Blocker</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }

      .popup {
        padding: 16px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      p {
        margin: 8px 0 0;
        line-height: 1.4;
        color: #4b5563;
      }

      .status {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        color: #166534;
        background: #dcfce7;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="popup">
      <div class="header">
        <img class="icon" src="icon48.png" alt="">
        <h1>Shorts Blocker</h1>
      </div>

      <p>Hiding Shorts buttons, shelves, and suggestions on YouTube.</p>

      <div class="status">Active</div>
    </main>
  </body>
</html>
